name: JonnyLean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Check generated catalog and imports
        run: python3 tools/jonnylean.py catalog check
      - name: Verify all tasks and their independent reviews
        run: python3 tools/jonnylean.py run all --jobs 2
      - name: Exercise successful and rejected changes
        run: python3 -m unittest discover -s tests -v
      - name: Package current source and evidence
        run: |
          python3 tools/jonnylean.py release build artifacts/JonnyLean.zip
          python3 tools/jonnylean.py release check artifacts/JonnyLean.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jonnylean-verification
          path: artifacts/
          if-no-files-found: warn

